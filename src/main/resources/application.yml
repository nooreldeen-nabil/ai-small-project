# ============================================================================
# LLM Agentic AI MVP - Application Configuration
# ============================================================================

spring:
  application:
    name: llm-agentic-ai-mvp

  # ========================================================================
  # Database Configuration - Oracle 23c AI Vector Search
  # ========================================================================
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE_NAME:FREEPDB1}
    username: ${ORACLE_USERNAME:ai_user}
    password: ${ORACLE_PASSWORD:ai_password_2024}
    driver-class-name: oracle.jdbc.OracleDriver

    # Connection Pool Settings (HikariCP)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: OracleHikariCP

  # ========================================================================
  # JPA / Hibernate Configuration
  # ========================================================================
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate  # Don't auto-create tables (we use SQL scripts)
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ========================================================================
  # Jackson JSON Configuration
  # ========================================================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # ========================================================================
  # Server Configuration
  # ========================================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# ============================================================================
# LLM Provider Configuration
# ============================================================================
llm:
  # Which LLM provider to use: CLAUDE, GEMINI, or OLLAMA
  provider: ${LLM_PROVIDER:GEMINI}

# ============================================================================
# Anthropic Claude API Configuration
# ============================================================================
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  api-url: https://api.anthropic.com/v1/messages
  model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:4096}
  temperature: 0.7
  timeout-seconds: 60

# ============================================================================
# Google Gemini API Configuration
# ============================================================================
gemini:
  api-key: ${GEMINI_API_KEY}
  api-url: https://generativelanguage.googleapis.com/v1beta
  model: ${GEMINI_MODEL:gemini-pro}
  max-tokens: ${GEMINI_MAX_TOKENS:2048}
  temperature: 0.7
  timeout-seconds: 60

# ============================================================================
# Vector Database Configuration
# ============================================================================
vector:
  dimension: ${VECTOR_DIMENSION:1536}
  distance-metric: ${VECTOR_DISTANCE_METRIC:COSINE}
  # For embeddings, we'll use Claude's text representation capabilities
  # Or integrate with a dedicated embedding model later

